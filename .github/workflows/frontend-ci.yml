name: frontend-ci

on:
  pull_request:
    branches: [dev, main]
    paths: ["FrontEnd/**", ".github/workflows/frontend-ci.yml"]
  push:
    branches: [dev, main]
    paths: ["FrontEnd/**", ".github/workflows/frontend-ci.yml"]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FrontEnd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: FrontEnd/package-lock.json
      - run: npm ci
      # PageProps and route types are generated by Next.js; create them before tsc.
      - run: npx next typegen
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
