name: esmarch

services:
  db:
    image: postgres:18
    pull_policy: always
    environment:
      POSTGRES_USER: esmarch
      POSTGRES_PASSWORD: esmarch
      POSTGRES_DB: esmarch
    ports: ["5432:5432"]
    volumes:
      # Postgres 18+ images keep data under /var/lib/postgresql/<major> (mount the parent dir).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U esmarch -d esmarch"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./BackEnd
      pull: true
    env_file:
      - path: ./BackEnd/.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://esmarch:esmarch@db:5432/esmarch
      # Origins the backend accepts browser requests from (the voice endpoints check Origin against this list).
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}
      # The Next proxy passes the caller's IP in this header (per-IP voice limits).
      CLIENT_IP_HEADER: x-sosnow-client-ip
      SUPPORT_ADMIN_TOKEN: ${SUPPORT_ADMIN_TOKEN:-}
      # Accounts: SUPABASE_URL comes from BackEnd/.env (see BackEnd/.env.example);
      # listing them here would let an unset shell variable override the file.
      # Requests arrive via the Next proxy: trust its X-Forwarded-For so rate limits apply per real client.
      # Dev/compose only. In production restrict this to the proxy's address.
      FORWARDED_ALLOW_IPS: "*"
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
    volumes:
      - ./BackEnd:/app
    develop:
      watch:
        - action: rebuild
          path: ./BackEnd/pyproject.toml
        - action: rebuild
          path: ./BackEnd/uv.lock
        - action: restart
          path: ./BackEnd/.env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  frontend:
    build:
      context: ./FrontEnd
      pull: true
    env_file:
      - path: ./FrontEnd/.env
        required: false
    environment:
      # Server-side calls inside the compose network; the browser only talks to the Next origin.
      BACKEND_URL: http://backend:8000
      WATCHPACK_POLLING: "true"
    ports: ["${FRONTEND_PORT:-3001}:3000"] # 3000 is often taken by other local Next apps
    depends_on:
      backend: { condition: service_healthy }
    volumes:
      - ./FrontEnd:/app
      - /app/node_modules
      - /app/.next
    develop:
      watch:
        - action: rebuild
          path: ./FrontEnd/package.json
        - action: rebuild
          path: ./FrontEnd/package-lock.json
        - action: restart
          path: ./FrontEnd/.env

volumes:
  pgdata:
